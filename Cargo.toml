[package]
name = "bevy_gas"
version = "0.1.0"
edition = "2024"

[features]
default = []
luban-config = ["dep:blake3", "dep:serde_json"]

[dependencies]
bevy = "0.19.1"
rand = "0.10.2"
blake3 = { version = "1.8.7", optional = true }
serde_json = { version = "1.0", optional = true }

[[bin]]
name = "gas-config"
path = "src/bin/gas_config.rs"
required-features = ["luban-config"]

[[example]]
name = "config_fireball"
path = "examples/config_fireball.rs"
required-features = ["luban-config"]
